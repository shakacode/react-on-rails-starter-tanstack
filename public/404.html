<!doctype html>
<html lang="en">
  <head>
    <title>Page not found | React on Rails Starter</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/error.css">
  </head>
  <body>
    <!-- This file lives in public/404.html -->
    <main>
      <section class="panel" aria-labelledby="error-title">
        <div class="code" aria-hidden="true">404</div>
        <div>
          <p class="eyebrow">Page not found</p>
          <h1 id="error-title">That route is not in this starter.</h1>
          <p>The page may have moved, or the address may not match one of the Rails or TanStack routes.</p>
          <div class="actions">
            <a class="primary" href="/">Go to start page</a>
            <a class="secondary" href="https://github.com/shakacode/react-on-rails-starter-tanstack">View GitHub repo</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
