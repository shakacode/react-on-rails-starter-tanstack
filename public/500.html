<!doctype html>
<html lang="en">
  <head>
    <title>Server error | React on Rails Starter</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      :root {
        color-scheme: light;
        --background: #fafafa;
        --foreground: #18181b;
        --muted: #f4f4f5;
        --muted-foreground: #52525b;
        --card: #ffffff;
        --border: #d4d4d8;
        --primary: #0f766e;
        --primary-foreground: #f8fafc;
        --accent: #be123c;
        --ring: #0f766e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #09090b;
          --foreground: #fafafa;
          --muted: #18181b;
          --muted-foreground: #a1a1aa;
          --card: #111113;
          --border: #27272a;
          --primary: #14b8a6;
          --primary-foreground: #042f2e;
          --accent: #fb7185;
          --ring: #2dd4bf;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      main {
        width: min(100%, 58rem);
        padding: 1.5rem;
      }

      .panel {
        display: grid;
        grid-template-columns: minmax(7rem, 12rem) minmax(0, 1fr);
        gap: 2rem;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: clamp(1.25rem, 4vw, 3rem);
      }

      .code {
        min-height: 7rem;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--muted);
        color: var(--accent);
        font-size: clamp(3rem, 11vw, 6rem);
        font-weight: 700;
        letter-spacing: 0;
      }

      .eyebrow {
        color: var(--primary);
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 0.75rem;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        max-width: 38rem;
        margin-top: 1rem;
        color: var(--muted-foreground);
        font-size: 1rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0.625rem 1rem;
        font-size: 0.9375rem;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 3px;
      }

      .primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }

      .secondary {
        border: 1px solid var(--border);
        color: var(--foreground);
        background: var(--card);
      }

      @media (max-width: 700px) {
        main {
          padding: 1rem;
        }

        .panel {
          grid-template-columns: 1fr;
          gap: 1.25rem;
        }

        .code {
          min-height: 5.5rem;
          justify-content: start;
          padding-inline: 1rem;
        }

        .actions {
          flex-direction: column;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- This file lives in public/500.html -->
    <main>
      <section class="panel" aria-labelledby="error-title">
        <div class="code" aria-hidden="true">500</div>
        <div>
          <p class="eyebrow">Server error</p>
          <h1 id="error-title">Something failed while serving this page.</h1>
          <p>Try again from the start page. If you are evaluating the starter, the repository has setup and debugging notes.</p>
          <div class="actions">
            <a class="primary" href="/">Go to start page</a>
            <a class="secondary" href="https://github.com/shakacode/react-on-rails-starter-tanstack">View GitHub repo</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
