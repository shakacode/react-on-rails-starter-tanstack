allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true

overrides:
  js-yaml: 4.3.2
  fast-uri: 3.1.9
  find-my-way: 9.7.0
  nanoid: 3.3.18
  postcss: 8.5.28
  browserslist: 4.28.7
  fastify: 5.12.5
  baseline-browser-mapping: 2.11.0
  '@fastify/busboy': 3.2.2
  seroval: 1.6.12
  source-map-js: 1.2.2
  # Keeps react-on-rails-rsc's ~19.3.0 Flight dependency on the patched direct
  # version. Remove once react-on-rails-rsc itself requires a patched release.
  react-server-dom-webpack: $react-server-dom-webpack

# These newly published React on Rails releases are intentional for this starter.
minimumReleaseAgeExclude:
  - react-on-rails-rsc@19.3.1
  - react-on-rails-pro-node-renderer@17.2.1-rc.3
  - react-on-rails-pro@17.2.1-rc.3
  - react-on-rails@17.2.1-rc.3
  - js-yaml@4.3.2
