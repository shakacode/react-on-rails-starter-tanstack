allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # core-js-pure only ships a postinstall funding/ad message, no real build step.
  'core-js-pure': false

overrides:
  sockjs>uuid: 11.1.1

# Fresh RC/stable packages are intentional for this starter.
minimumReleaseAgeExclude:
  - shakapacker-rspack@10.1.0
  - shakapacker@10.1.0
  - react-on-rails-pro-node-renderer@17.0.0-rc.2
  - react-on-rails-pro@17.0.0-rc.2
  - react-on-rails@17.0.0-rc.2
  - react-on-rails-rsc
