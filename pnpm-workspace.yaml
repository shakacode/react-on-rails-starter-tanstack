allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true

overrides:
  js-yaml: 4.3.2
  fast-uri: 3.1.6
  find-my-way: 9.7.0
  nanoid: 3.3.18
  postcss: 8.5.28
  browserslist: 4.28.7
  fastify: 5.12.1
  baseline-browser-mapping: 2.11.0

# Fresh RC/stable packages are intentional for this starter.
minimumReleaseAgeExclude:
  - react-on-rails-rsc
  - react-on-rails-pro-node-renderer@17.1.0
  - react-on-rails-pro@17.1.0
  - react-on-rails@17.1.0
  - js-yaml@4.3.2
  - shakapacker-rspack@10.2.0
  - shakapacker@10.2.0
