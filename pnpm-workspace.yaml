allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true

# Fresh RC packages are intentional for this starter.
minimumReleaseAgeExclude:
  - react-on-rails-pro-node-renderer@16.7.0-rc.1
  - react-on-rails-pro@16.7.0-rc.1
  - react-on-rails@16.7.0-rc.1

# Temporary workaround for react-on-rails-pro@16.7.0-rc.1 publishing
# react-on-rails as workspace:*. Remove after:
# https://github.com/shakacode/react_on_rails/issues/3389
overrides:
  react-on-rails-pro>react-on-rails: 16.7.0-rc.1
