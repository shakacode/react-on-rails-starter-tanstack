allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # core-js-pure only ships a postinstall funding/ad message, no real build step.
  'core-js-pure': false

# Fresh RC/stable packages are intentional for this starter.
minimumReleaseAgeExclude:
  - react-on-rails-pro-node-renderer@16.7.0-rc.3
  - react-on-rails-pro@16.7.0-rc.3
  - react-on-rails@16.7.0-rc.3
  - shakapacker-rspack@10.1.0
  - shakapacker@10.1.0
