allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # core-js-pure only ships a postinstall funding/ad message, no real build step.
  'core-js-pure': false

overrides:
  http-proxy-middleware: 2.0.10
  js-yaml: 4.2.0
  launch-editor: 2.14.1
  sockjs>uuid: 11.1.1

# Fresh RC/stable packages are intentional for this starter.
minimumReleaseAgeExclude:
  - react-on-rails-rsc
  - react-on-rails-pro-node-renderer@17.0.0-rc.7
  - react-on-rails-pro@17.0.0-rc.7
  - react-on-rails@17.0.0-rc.7
  - js-yaml@4.2.0
  - shakapacker-rspack@10.2.0
  - shakapacker@10.2.0
