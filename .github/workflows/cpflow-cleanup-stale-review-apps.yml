name: Cleanup Stale Review Apps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  cleanup:
    # Cleanup targets the current inferred review-app prefix. If you changed
    # naming conventions, manually delete review apps under the old prefix.
    uses: shakacode/control-plane-flow/.github/workflows/cpflow-cleanup-stale-review-apps.yml@f979dcbe0e5c327acfc979fa14a0b068487d11fa # v6.1.0
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
