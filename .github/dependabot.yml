# Grouped Dependabot updates: one PR per ecosystem (Ruby / JavaScript / GitHub Actions)
# instead of one PR per dependency. Tracks npm so the shakapacker gem and npm
# package move together. 3-day cooldown so a freshly published version can't be
# yanked after the PR opens. Patterned on shakacode/react_on_rails.
version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      react-on-rails:
        patterns:
          - "react_on_rails*"
      ruby:
        patterns:
          - "*"
    # React on Rails final-line majors are intentionally promoted through the
    # fleet validation process, not an automatic dependency PR.
    ignore:
      - dependency-name: "react_on_rails"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react_on_rails_pro"
        update-types: ["version-update:semver-major"]
      # json 3 breaks ActiveSupport 8.1's JSON.decode (JSON.parse arity), which
      # fails every signed/encrypted cookie read. Revisit with a Rails upgrade.
      - dependency-name: "json"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      react-on-rails:
        patterns:
          - "react-on-rails*"
      javascript:
        patterns:
          - "*"
    # This app has no direct Babel dependency, so a Babel 8 ignore would be
    # inert. Product-package majors require explicit fleet validation.
    ignore:
      - dependency-name: "react-on-rails-pro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-on-rails-pro-node-renderer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-on-rails-rsc"
        update-types: ["version-update:semver-major"]
      # React on Rails Pro 17 (doctor and node renderer) supports only React
      # 19.2.x, so React minors wait for the fleet React upgrade. react-refresh
      # ships from the React repo with each React minor, so it moves with them.
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-server-dom-webpack"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-refresh"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
